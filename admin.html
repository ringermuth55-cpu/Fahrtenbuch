<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Fahrtenbuch Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px}
h1{margin:5px 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;margin-top:5px}
label,.muted{font-size:13px;color:#6b7280}
button{border:0;border-radius:12px;padding:13px 14px;font-weight:800;background:#111827;color:#fff}
button.light{background:#e5e7eb;color:#111827}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:#fafafa;border:1px solid #e5e7eb;border-radius:12px;padding:12px}
.metric small{display:block;color:#6b7280}.metric strong{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
th{background:#f9fafb;position:sticky;top:0}
.tablewrap{overflow:auto;max-height:520px;border:1px solid #e5e7eb;border-radius:12px}
.hidden{display:none!important}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.grid,.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid,.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Fahrtenbuch Admin</h1>

<div id="loginCard" class="card">
  <b>Admin-Login</b>
  <label><br>E-Mail<input id="email" type="email"></label>
  <label><br>Passwort<input id="password" type="password"></label>
  <button id="login" style="width:100%;margin-top:12px">ANMELDEN</button>
  <div id="msg" class="muted" style="margin-top:8px"></div>
</div>

<div id="admin" class="hidden">
  <div class="card">
    <div class="grid">
      <label>Von<input id="from" type="date"></label>
      <label>Bis<input id="to" type="date"></label>
      <label>Fahrer<select id="driver"><option value="">Alle Fahrer</option></select></label>
      <label>Fahrzeug<select id="vehicle"><option value="">Alle Fahrzeuge</option></select></label>
    </div>
    <div class="actions" style="margin-top:12px">
      <button id="apply">FILTER ANWENDEN</button>
      <button id="exportCsv" class="light">EXCEL/CSV EXPORT</button>
      <button id="logout" class="light">ABMELDEN</button>
    </div>
  </div>

  <div class="card metrics">
    <div class="metric"><small>Arbeitszeit</small><strong id="mWork">0 h 00 min</strong></div>
    <div class="metric"><small>Fahrzeit</small><strong id="mDrive">0 h 00 min</strong></div>
    <div class="metric"><small>Pause</small><strong id="mPause">0 h 00 min</strong></div>
    <div class="metric"><small>Sonstige Arbeit</small><strong id="mOther">0 h 00 min</strong></div>
  </div>

  <div class="card">
    <b>Arbeitstage & Tätigkeiten</b>
    <div class="tablewrap" style="margin-top:10px">
      <table>
        <thead>
          <tr>
            <th>Datum</th><th>Fahrer</th><th>Fahrzeug</th><th>Arbeitsbeginn</th><th>Arbeitsende</th>
            <th>Typ</th><th>Beginn</th><th>Ende</th><th>Dauer</th><th>Bemerkung</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
</div>

<script>
const U="https://ykqfpytepnumgjfpdzix.supabase.co",K="sb_publishable_EE3kx2QEQ9IsyEz4xxvFjw_aMJQiUwO";
let S=JSON.parse(localStorage.getItem("fb_admin_s")||"null");
let profiles=[],vehicles=[],workdays=[],activities=[];

const $=x=>document.querySelector(x);
const D=x=>new Date(x);
const pad=n=>String(n).padStart(2,"0");
const tm=x=>x?`${pad(D(x).getHours())}:${pad(D(x).getMinutes())}:${pad(D(x).getSeconds())}`:"";
const dm=x=>x?`${pad(D(x).getDate())}.${pad(D(x).getMonth()+1)}.${D(x).getFullYear()}`:"";
const mins=(a,b)=>a&&b?Math.max(0,(D(b)-D(a))/60000):0;
const hm=m=>{m=Math.round(+m||0);return `${Math.floor(m/60)} h ${pad(m%60)} min`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function req(path,opt={}){
  const r=await fetch(U+"/rest/v1/"+path,{...opt,headers:{apikey:K,Authorization:"Bearer "+S.access_token,"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});
  if(!r.ok) throw Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):null;
}

async function login(){
  try{
    $("#msg").textContent="Anmeldung…";
    const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:$("#email").value.trim(),password:$("#password").value})});
    const x=await r.json(); if(!r.ok) throw Error(x.msg||x.error_description||"Login fehlgeschlagen");
    S=x; localStorage.setItem("fb_admin_s",JSON.stringify(S)); await init();
  }catch(e){$("#msg").textContent=e.message}
}

async function init(){
  if(!S?.access_token)return;
  try{
    const me=await req("profiles?id=eq."+S.user.id+"&select=*");
    if(!me.length || me[0].role!=="admin") throw Error("Dieses Konto hat keine Admin-Rechte.");
    $("#loginCard").classList.add("hidden"); $("#admin").classList.remove("hidden");

    profiles=await req("profiles?select=id,full_name,role&order=full_name");
    vehicles=await req("vehicles?select=id,name,license_plate,active&order=name");

    $("#driver").innerHTML='<option value="">Alle Fahrer</option>'+profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join("");
    $("#vehicle").innerHTML='<option value="">Alle Fahrzeuge</option>'+vehicles.map(v=>`<option value="${v.id}">${esc(v.name)}${v.license_plate?" · "+esc(v.license_plate):""}</option>`).join("");

    const d=new Date(), first=new Date(d.getFullYear(),d.getMonth(),1);
    $("#from").value=first.toISOString().slice(0,10);
    $("#to").value=d.toISOString().slice(0,10);
    await loadData();
  }catch(e){
    $("#msg").textContent=e.message;
    $("#loginCard").classList.remove("hidden");
    $("#admin").classList.add("hidden");
  }
}

async function loadData(){
  const from=$("#from").value, to=$("#to").value;
  const drv=$("#driver").value, veh=$("#vehicle").value;

  let q="workdays?select=*&started_at=gte."+encodeURIComponent(from+"T00:00:00")+"&started_at=lte."+encodeURIComponent(to+"T23:59:59")+"&order=started_at";
  if(drv) q+="&user_id=eq."+drv;
  if(veh) q+="&vehicle_id=eq."+veh;
  workdays=await req(q);

  const ids=workdays.map(w=>w.id);
  activities=[];
  if(ids.length){
    activities=await req("activities?select=*&workday_id=in.("+ids.join(",")+")&order=started_at");
  }
  render();
}

function render(){
  let tWork=0,tDrive=0,tPause=0,tOther=0;
  const profileMap=Object.fromEntries(profiles.map(p=>[p.id,p]));
  const vehicleMap=Object.fromEntries(vehicles.map(v=>[v.id,v]));
  const rows=[];

  for(const w of workdays){
    const acts=activities.filter(a=>a.workday_id===w.id);
    const pause=acts.filter(a=>a.activity_type==="Pause").reduce((s,a)=>s+mins(a.started_at,a.ended_at||new Date().toISOString()),0);
    const gross=w.ended_at?mins(w.started_at,w.ended_at):0;
    if(w.ended_at) tWork+=Math.max(0,gross-pause);

    if(!acts.length){
      rows.push({w,a:null});
    } else {
      for(const a of acts){
        const m=mins(a.started_at,a.ended_at||new Date().toISOString());
        if(a.activity_type==="Fahrt")tDrive+=m;
        if(a.activity_type==="Pause")tPause+=m;
        if(a.activity_type==="Sonstige Arbeit")tOther+=m;
        rows.push({w,a});
      }
    }
  }

  $("#mWork").textContent=hm(tWork); $("#mDrive").textContent=hm(tDrive); $("#mPause").textContent=hm(tPause); $("#mOther").textContent=hm(tOther);

  $("#rows").innerHTML=rows.map(({w,a})=>{
    const p=profileMap[w.user_id],v=vehicleMap[w.vehicle_id];
    return `<tr>
      <td>${dm(w.started_at)}</td>
      <td>${esc(p?.full_name||w.user_id)}</td>
      <td>${esc(v?(v.name+(v.license_plate?" · "+v.license_plate:"")):"")}</td>
      <td>${tm(w.started_at)}</td>
      <td>${tm(w.ended_at)}</td>
      <td>${esc(a?.activity_type||"")}</td>
      <td>${tm(a?.started_at)}</td>
      <td>${tm(a?.ended_at)}</td>
      <td>${a?hm(mins(a.started_at,a.ended_at||new Date().toISOString())):""}</td>
      <td>${esc(a?.note||"")}</td>
    </tr>`;
  }).join("");
}

function csvEscape(v){v=String(v??"");if(/[;"\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v}
function exportCsv(){
  const profileMap=Object.fromEntries(profiles.map(p=>[p.id,p]));
  const vehicleMap=Object.fromEntries(vehicles.map(v=>[v.id,v]));
  const head=["Datum","Fahrer","Fahrzeug","Arbeitsbeginn","Arbeitsende","Typ","Beginn","Ende","Dauer_Minuten","Bemerkung"];
  const lines=[head.join(";")];
  for(const w of workdays){
    const acts=activities.filter(a=>a.workday_id===w.id);
    const arr=acts.length?acts:[null];
    for(const a of arr){
      const p=profileMap[w.user_id],v=vehicleMap[w.vehicle_id];
      const vals=[
        dm(w.started_at),
        p?.full_name||w.user_id,
        v?(v.name+(v.license_plate?" · "+v.license_plate:"")):"",
        tm(w.started_at),tm(w.ended_at),
        a?.activity_type||"",
        tm(a?.started_at),tm(a?.ended_at),
        a?mins(a.started_at,a.ended_at||new Date().toISOString()).toFixed(1).replace(".",","):"",
        a?.note||""
      ];
      lines.push(vals.map(csvEscape).join(";"));
    }
  }
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`fahrtenbuch_admin_${$("#from").value}_bis_${$("#to").value}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

$("#login").onclick=login;
$("#apply").onclick=loadData;
$("#exportCsv").onclick=exportCsv;
$("#logout").onclick=()=>{localStorage.removeItem("fb_admin_s");location.reload()};
init();
</script>
</body>
</html>
